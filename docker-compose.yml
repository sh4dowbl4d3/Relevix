services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: relevix-db
    environment:
      POSTGRES_DB: relevix
      POSTGRES_USER: relevix
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevix -d relevix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
